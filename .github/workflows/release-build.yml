name: Release build
on:
  push:
    branches: [local/0.1.136-persian-overlay]

  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-overlay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - run: pnpm install --frozen-lockfile
      - name: Install audio decoder for duration-limit tests
        run: |
          if ! command -v ffmpeg; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: pnpm exec vitest run server/gemini-live.test.ts server/routes/gemini-live.test.ts src/lib/gemini-live-client.test.ts server/gemini-voice.test.ts server/gemini-voice-audio.test.ts server/routes/gemini-voice.test.ts server/routes/tts.test.ts server/tts/tts.test.ts server/request-auth.test.ts src/lib/use-browser-dictation.test.ts src/components/Composer.dictation.test.ts src/components/Composer.phone.test.ts src/components/Composer.simple.test.ts src/components/ComposerDictationButton.test.ts src/components/VoiceSettings.test.ts server/bot-box/broker.test.ts server/mcp-oauth-discovery.test.ts shared/markdown-windows-paths.test.ts src/lib/model-stars.test.ts src/lib/curated-models.test.ts src/components/ModelPicker.simple.test.ts src/lib/simple-model-menu.test.ts server/drivers/openai-compat.test.ts server/drivers/openrouter-free.test.ts server/drivers/acp/opencode-go.test.ts shared/research-request.test.ts src/lib/research-commands.test.ts src/lib/research-mission.test.ts src/components/ResearchMissionCard.test.ts src/lib/research-draft.test.ts src/components/ResearchRequestBar.test.ts server/routes/bot-messages.test.ts server/send-idempotency.test.ts server/chat-followups.test.ts server/research-request-api.test.ts server/research-content.test.ts server/browser-runtime.test.ts server/browser-tool-shape.test.ts src/lib/bot-now.test.ts shared/research-request.test.ts src/components/bot-settings/BotNowCard.test.ts src/components/bot-panel/memory-notes.test.ts src/components/bot-panel/MemoryPage.team.test.ts src/components/bot-panel/MemoryPage.undo.test.ts server/routes/bot-memory.test.ts server/request-auth.test.ts src/lib/memory.test.ts src/components/bot-settings/MemorySection.test.ts --maxWorkers=1
      - run: pnpm exec vitest run src/components/ChatView.controls.test.ts -t 'research request receipts' --maxWorkers=1
      - run: pnpm build:server && pnpm exec vite build && node scripts/build-npm-package.mjs
      - run: node -e "require('fs').writeFileSync('release/npm/voice-build.json', JSON.stringify({commit:process.env.GITHUB_SHA}))"
      - run: tar -C release/npm -czf /tmp/omb-voice-release.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: omb-voice-release
          path: /tmp/omb-voice-release.tar.gz
          retention-days: 3
